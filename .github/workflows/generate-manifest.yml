name: Generate Manifests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate photo manifest
        run: |
          python3 - <<'PYEOF'
          import os, json
          exts = {'.jpg','.jpeg','.png','.gif','.webp','.avif'}
          files = sorted(f for f in os.listdir('photos') if os.path.splitext(f.lower())[1] in exts)
          with open('photos/manifest.json','w') as fp: json.dump(files, fp, indent=2)
          print(f"Photos: {len(files)} files")
          PYEOF

      - name: Generate music manifest
        run: |
          python3 - <<'PYEOF'
          import os, json
          exts = {'.mp3','.ogg','.wav','.flac','.m4a','.aac','.opus'}
          files = sorted(f for f in os.listdir('music') if os.path.splitext(f.lower())[1] in exts)
          with open('music/manifest.json','w') as fp: json.dump(files, fp, indent=2)
          print(f"Music: {len(files)} files")
          PYEOF

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/manifest.json music/manifest.json
          git diff --cached --quiet || git commit -m "chore: update manifests [skip ci]"
          git push
